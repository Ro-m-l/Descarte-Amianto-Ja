name: CI/CD - Docker Compose + AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Clona o repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura Java (para rodar testes do Spring)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build do backend com Maven (testes mock rodando via H2)
      - name: Build do backend
        working-directory: ./backend
        run: mvn clean package -DskipTests=false

      # Build das imagens Docker (apenas para validar Dockerfiles, não roda containers)
      - name: Build das imagens Docker
        run: |
          docker build -t meu-backend ./backend
          docker build -t meu-frontend ./frontend

      # Compacta e envia para o servidor AWS via SSH
      - name: Enviar arquivos para o servidor AWS Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "./*"
          target: "~/docker"

      # Rodar docker compose no servidor remoto
      - name: Rodar Docker Compose no servidor AWS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/docker
            # Limpa imagens, volumes e containers antigos para liberar espaço
            docker system prune -f
            docker compose down
            docker compose build
            docker compose up -d