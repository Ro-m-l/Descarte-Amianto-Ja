# ------------------------------------------------------
# Redireciona todo o tráfego HTTP (porta 80) para HTTPS
# ------------------------------------------------------
server {
    listen 80;
    server_name descarteamiantoja.com.br www.descarteamiantoja.com.br;

    # Redireciona para HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------
# Servidor HTTPS principal
# ------------------------------------------------------
server {
    listen 443 ssl;
    server_name descarteamiantoja.com.br www.descarteamiantoja.com.br;

    # Certificados SSL (substitua pelo caminho correto dos certificados)
    ssl_certificate /etc/letsencrypt/live/descarteamiantoja.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/descarteamiantoja.com.br/privkey.pem;

    # Protocolos e configurações de segurança recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Diretório onde estão os arquivos estáticos do frontend (build)
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------
    # Frontend SPA (React/Vue/Angular)
    # O try_files redireciona tudo para index.html
    # ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------
    # Proxy reverso para o backend (Spring Boot)
    # ------------------------------------------------------
    location /api/ {
        proxy_pass http://spring_backend:8080/api/;  # Ajuste conforme necessário
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------
    # (Opcional) Limitar tamanho de upload para requisições grandes
    # ------------------------------------------------------
    client_max_body_size 20M;
}
