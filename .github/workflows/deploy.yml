name: CI/CD - Docker Compose + AWS Lightsail

on:
  push:
    branches:
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Clona o repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura Java (para rodar testes do Spring)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Maven packages
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Criar .env antes de buildar
      - name: Create .env file
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DBUSER=${{ secrets.DB_USER }}" >> .env
          echo "DBPASS=${{ secrets.DB_PASSWORD }}" >> .env
          echo "SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}" >> .env
          echo "ORS_API_KEY=${{ secrets.ORS_API_KEY }}" >> .env

      # Build do backend com Maven (testes mock rodando via H2)
      - name: Build do backend
        working-directory: ./backend
        run: mvn clean package -DskipTests=false

      # Build das imagens Docker (apenas para validar Dockerfiles, não roda containers)
      - name: Build das imagens Docker
        run: |
          docker build -t meu-backend ./backend

      # Compacta e envia para o servidor AWS via SSH
      - name: Enviar arquivos para o servidor AWS Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "./*"
          target: "~/docker"

      # Rodar docker compose no servidor remoto (preservando volumes)
      - name: Rodar Docker Compose no servidor AWS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/docker
            # Limpa containers e imagens antigas, preservando volumes
            docker system prune -f --volumes=false
            # Para containers antigos do compose, sem remover volumes
            docker-compose down --remove-orphans
            # Rebuild e start
            docker-compose build
            docker-compose up -d
