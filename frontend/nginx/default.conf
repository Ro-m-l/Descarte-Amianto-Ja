server {
    listen 80;

    server_name localhost;

    # Serve os arquivos estáticos do React
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy para o backend nas rotas da API
    location /api/ {
        proxy_pass http://spring_backend:8080;  # Remover a barra no final
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Outras configurações, como redirecionamento ou cache, podem ser adicionadas aqui
}
