name: CI/CD - Docker Compose + AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Clona o repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura Java (para rodar testes do Spring)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build do backend com Maven
      - name: Build do backend
        working-directory: ./backend
        run: mvn clean package -DskipTests=false -Ptest

      # Build das imagens Docker
      - name: Build das imagens Docker
        run: |
          docker build -t meu-frontend ./frontend
          docker build -t meu-backend ./backend
          docker build -t meu-mysql ./mysql

      # Testa container backend
      # Esta etapa serve para rodar os testes integrados dentro de um container,
      # garantindo que a aplicação funcione em ambiente containerizado antes do deploy.
      # A falta dela significa que você só testa localmente no Maven.
      - name: Rodar testes integrados no container backend
        run: |
          docker run --rm meu-backend ./mvnw test -Ptest

      # Compacta e envia pro servidor AWS via SSH
      - name: Enviar arquivos para o servidor AWS Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "./*"
          target: "~/docker"

      # Rodar docker compose no servidor remoto
      - name: Rodar Docker Compose no servidor AWS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/docker
            # Limpa imagens, volumes e containers antigos para liberar espaço
            docker system prune -f
            docker compose down
            docker compose build
            docker compose up -d